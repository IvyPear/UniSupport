name: Cập nhật Form Task Cha & Con

on:
  workflow_dispatch:
    inputs:
      parent_id:
        description: 'ID của Task Cha (VD: 135)'
        required: true
        type: string
      label_wbs:
        description: 'Nhãn của Sub-tasks (VD: M01)'
        required: true
        type: string
      milestone_text:
        description: 'Tên Milestone (VD: Mốc 1: Nền tảng)'
        required: false
        type: string

permissions:
  issues: write

jobs:
  update-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Áp dụng Form cho Task Cha và Task Con
        uses: actions/github-script@v7
        with:
          script: |
            const rawId = context.payload.inputs.parent_id || '';
            const parentId = parseInt(rawId.replace(/\D/g, ''), 10);
            
            if (isNaN(parentId)) {
              core.setFailed("Lỗi: ID của Task Cha không hợp lệ.");
              return;
            }

            const labelWbs = context.payload.inputs.label_wbs;
            const milestoneText = context.payload.inputs.milestone_text || '';
            
            // Lấy danh sách tất cả issue cùng nhãn
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labelWbs,
              state: 'all',
              per_page: 100
            });
            
            // Tách riêng Task Cha và danh sách Task Con
            const subTasks = issues.filter(issue => issue.number !== parentId);
            
            let subTasksString = '';
            subTasks.forEach(issue => {
              const isClosed = issue.state === 'closed' ? 'x' : ' ';
              subTasksString += `- [${isClosed}] #${issue.number} ${issue.title}\n`;
            });
            
            if (!subTasksString) {
              subTasksString = '- [ ] Chưa có task con.\n';
            }

            // ==========================================
            // 1. CẬP NHẬT FORM CHO TASK CHA
            // ==========================================
            const parentBody = `
            ### 1) Mục tiêu:
            Mục tiêu của module ${labelWbs} làm gì...

            ### 2) Thông tin:
            - **Milestone:** ${milestoneText}
            - **Nhãn đề xuất:** ${labelWbs}

            ### Task con:
            ${subTasksString}
            `.replace(/^[ \t]+/gm, '').trim();

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: parentId,
              body: parentBody
            });

            // ==========================================
            // 2. CẬP NHẬT FORM CHO TẤT CẢ TASK CON
            // ==========================================
            const subTaskBody = `
            ### 1) Mô tả:
            Mô tả nội dung của task con đó...

            ### 2) Tiêu chí hoàn thành:
            - [ ] Tiêu chí 1
            - [ ] Tiêu chí 2
            `.replace(/^[ \t]+/gm, '').trim();

            for (const issue of subTasks) {
              // Cơ chế an toàn: Chỉ ghi đè nếu phần mô tả đang trống 
              // hoặc chưa chứa form "Tiêu chí hoàn thành"
              if (!issue.body || !issue.body.includes('Tiêu chí hoàn thành')) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  body: subTaskBody
                });
              }
            }
