name: AI Tự Động Viết Nội Dung Issue

on:
  workflow_dispatch:
    inputs:
      module_code:
        description: 'Mã Module cần AI viết (VD: M01). Để trống sẽ chạy cho TOÀN BỘ dự án.'
        required: false
        type: string

permissions:
  issues: write

jobs:
  ai-generate-content:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Lấy chìa khóa AI bạn đã cài đặt
    steps:
      - name: Gọi AI và Cập nhật Issue
        uses: actions/github-script@v7
        with:
          script: |
            const modCodeFilter = context.payload.inputs.module_code || '';
            const apiKey = process.env.GEMINI_API_KEY;
            
            if (!apiKey) {
              core.setFailed("Lỗi: Không tìm thấy GEMINI_API_KEY trong GitHub Secrets.");
              return;
            }

            // 1. Lấy toàn bộ issues
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all',
              per_page: 100
            });

            // 2. Phân loại theo mã Module
            const modules = {};
            issues.forEach(issue => {
              const match = issue.title.match(/\[([A-Z0-9]+)(?:-[0-9]+)?\]/i);
              if (match) {
                const modCode = match[1].toUpperCase();
                
                // Lọc nếu người dùng chỉ định 1 module cụ thể
                if (modCodeFilter && modCode !== modCodeFilter.toUpperCase()) return;

                if (!modules[modCode]) modules[modCode] = { parent: null, subtasks: [] };
                
                if (issue.title.includes(`[${modCode}] `) || issue.title === `[${modCode}]`) {
                  modules[modCode].parent = issue;
                } else if (issue.title.includes(`[${modCode}-`)) {
                  modules[modCode].subtasks.push(issue);
                }
              }
            });

            // 3. Hàm gọi API của Google Gemini
            async function askAI(prompt) {
              const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${apiKey}`;
              const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [{ text: prompt }] }]
                })
              });
              const result = await response.json();
              if (result.error) throw new Error(result.error.message);
              return result.candidates[0].content.parts[0].text;
            }

            // 4. Bắt đầu nhờ AI viết bài cho từng Task
            for (const [modCode, data] of Object.entries(modules)) {
              if (!data.parent) continue;
              const parentTitle = data.parent.title;
              console.log(`Đang xử lý Module: ${modCode}`);

              for (const issue of data.subtasks) {
                // Kiểm tra xem Issue đã có nội dung chưa, có rồi thì bỏ qua để tránh ghi đè
                if (issue.body && issue.body.includes('Tiêu chí hoàn thành')) {
                  console.log(`Bỏ qua #${issue.number}: Đã có nội dung.`);
                  continue;
                }

                console.log(`Đang nhờ AI viết cho Task: ${issue.title}...`);
                
                // Trình bày yêu cầu cho AI (Prompt Engineering)
                const prompt = `Bạn là một chuyên gia Product Manager/BA hệ thống IT. 
                Hãy viết nội dung cho một task lập trình có tiêu đề là: "${issue.title}".
                Task này thuộc tính năng lớn là: "${parentTitle}".
                
                Nhiệm vụ: Viết chính xác theo ĐÚNG định dạng Markdown dưới đây. Tuyệt đối KHÔNG thêm lời chào, KHÔNG giải thích, CHỈ xuất ra nội dung form:
                
                ### 1) Mô tả
                [Mô tả chi tiết nhưng ngắn gọn về tính năng này]

                ### 2) Main flow
                1. [Bước 1]
                2. [Bước 2]
                (Liệt kê các bước luồng đi chính)

                ### 3) Tiêu chí hoàn thành
                - [ ] [Tiêu chí kiểm thử 1]
                - [ ] [Tiêu chí kiểm thử 2]
                (Liệt kê 3-5 tiêu chí nghiệm thu chặt chẽ)`;

                try {
                  const aiResponse = await askAI(prompt);
                  
                  // Làm sạch kết quả trả về (đề phòng AI chèn thêm blockcode markdown)
                  const cleanBody = aiResponse.replace(/^```markdown\s*/, '').replace(/```$/, '').trim();

                  // Cập nhật Issue
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issue.number,
                    body: cleanBody
                  });
                  console.log(`✅ Viết xong và cập nhật thành công Task #${issue.number}`);
                  
                  // Nghỉ 2 giây giữa mỗi lần gọi AI để tránh bị giới hạn API (Rate limit)
                  await new Promise(r => setTimeout(r, 2000));
                  
                } catch (error) {
                  console.log(`❌ Lỗi khi nhờ AI viết Task #${issue.number}:`, error.message);
                }
              }
            }
